name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump package.json version
        id: bump
        run: |
          NEW_VERSION=$(npm version ${{ github.event.inputs.bump_type }} --no-git-tag-version)
          NEW_VERSION="${NEW_VERSION#v}"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          git push

  # Builds only — nothing gets published here. Every OS uploads its
  # installer(s) as a plain CI artifact and the release job below waits for
  # all of them before creating one release with everything attached, so
  # there's never a partially-uploaded release visible to anyone.
  build:
    needs: bump-version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build

      - name: Package (build only, no publish)
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Collect installer assets
        shell: bash
        run: |
          mkdir -p release-assets
          find release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} release-assets/ \;
          ls -la release-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: remotely-${{ matrix.os }}
          path: release-assets/*

  release:
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.bump-version.outputs.new_version }}" \
            --title "Remotely v${{ needs.bump-version.outputs.new_version }}" \
            --notes "## Remotely v${{ needs.bump-version.outputs.new_version }}

          Download the installer for your platform:
          - **Windows** — the \`.exe\` installer
          - **macOS** — the \`.dmg\` or \`.zip\`
          - **Linux** — the \`.AppImage\` (portable) or \`.deb\` (Debian/Ubuntu)" \
            release-assets/*
